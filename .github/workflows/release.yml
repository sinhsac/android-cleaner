name: Build & Release APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write   # cần để tạo Release và upload asset

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize gradlew line endings
        run: sed -i 's/\r$//' gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest đã cài sẵn Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT).
      # Không dùng android-actions/setup-android vì bản v3 lỗi "Failed to find package 'tools'".
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Point local.properties to runner SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          mkdir -p dist
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          VERSION="${GITHUB_REF_NAME}"
          OUT="dist/FolderCleaner-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=FolderCleaner-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      # Upload APK như artifact cho mọi lần build (kể cả push master, không có tag)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderCleaner-apk
          path: ${{ steps.apk.outputs.apk_path }}

      # Các bước dưới chỉ chạy khi đẩy tag v* -> tạo Release
      - name: Generate QR code to the APK download URL
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -m pip install --quiet "qrcode[pil]" || python3 -m pip install --quiet --break-system-packages "qrcode[pil]"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.apk.outputs.apk_name }}"
          echo "APK_URL=$APK_URL"
          python3 - "$APK_URL" <<'PY'
          import sys, qrcode
          url = sys.argv[1]
          img = qrcode.make(url)
          img.save("dist/qr.png")
          print("QR saved for", url)
          PY

      - name: Create GitHub Release (APK + QR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Folder Cleaner ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            APK debug (ký bằng debug key mặc định) để test trên thiết bị thật.

            **Cài nhanh:** quét QR dưới đây bằng camera điện thoại để tải thẳng APK, rồi cài (bật "Cài từ nguồn không xác định").

            ![QR](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/qr.png)

            > Đây là bản debug, không dùng cho phân phối chính thức.
          files: |
            ${{ steps.apk.outputs.apk_path }}
            dist/qr.png
